@if (group(); as g) {
  <section class="group-summary">
    <div class="group-summary-head">
      <div>
        <div class="group-summary-label">General goal</div>
        <h2>{{ g.name }}</h2>
      </div>
      <span class="group-summary-percent">{{ percent() | number: '1.0-0' }}% overall</span>
    </div>
    <div class="progress-track" aria-label="Overall group progress">
      <div class="progress-fill" [style.width.%]="percent()"></div>
    </div>
    <p class="group-summary-caption">
      {{ g.goals.length }} sub-goal{{ g.goals.length === 1 ? '' : 's' }} — overall progress is the average of each
      sub-goal's completion.
    </p>
  </section>
}
