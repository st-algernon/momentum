<section class="history">
  <h2>History</h2>
  <div class="history-list">
    @if (!logs().length) {
      <div class="empty-state">No activity yet. Log your first entry above.</div>
    } @else {
      @for (log of logs(); track log.id) {
        <div class="history-item">
          <span class="history-date">{{ formatDateTime(log) }}</span>
          <span class="history-amount">{{ formatAmount(log.amount, goal().unit) }}</span>
          <button class="icon-btn" type="button" (click)="removeLog(log)" aria-label="Delete entry" matTooltip="Delete entry">
            <fa-icon [icon]="faTrash"></fa-icon>
          </button>
        </div>
      }
    }
  </div>
</section>
