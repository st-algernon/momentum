<section class="history">
  <div class="history-head">
    <h2>History</h2>
    @if (totalPages() > 1) {
      <div class="history-pagination">
        <button class="page-nav-btn" type="button" [disabled]="currentPage() === 0" (click)="prevPage()" aria-label="Previous page">
          <fa-icon [icon]="faPrev"></fa-icon>
        </button>
        <span class="history-page-label">Page {{ currentPage() + 1 }} of {{ totalPages() }}</span>
        <button class="page-nav-btn" type="button" [disabled]="currentPage() >= totalPages() - 1" (click)="nextPage()" aria-label="Next page">
          <fa-icon [icon]="faNext"></fa-icon>
        </button>
      </div>
    }
  </div>
  <div class="history-list">
    @if (!logs().length) {
      <div class="empty-state">No activity yet. Log your first entry above.</div>
    } @else {
      @for (log of pagedLogs(); track log.id) {
        <div class="history-item">
          <span class="history-date">{{ formatDateTime(log) }}</span>
          <span class="history-amount">{{ formatAmount(log.amount, goal().unit) }}</span>
          <button class="icon-btn" type="button" (click)="removeLog(log)" aria-label="Delete entry" matTooltip="Delete entry">
            <fa-icon [icon]="faTrash"></fa-icon>
          </button>
        </div>
      }
    }
  </div>
</section>
