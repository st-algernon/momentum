<section class="history">
  <h2>Recent activity</h2>
  <div class="history-list">
    @if (!logs().length) {
      <div class="empty-state">No activity yet. Log your first study session above.</div>
    } @else {
      @for (log of logs(); track log.id) {
        <div class="history-item">
          <div class="history-date">{{ formatDate(log.date) }}</div>
          <div class="history-hours">{{ formatHours(log.hours) }}</div>
          <div class="history-note">{{ log.note || 'Learning session' }}</div>
          <button class="icon-btn" type="button" (click)="removeLog(log)">Delete</button>
        </div>
      }
    }
  </div>
</section>
