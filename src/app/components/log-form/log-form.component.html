<section>
  <h2>Log today's learning</h2>
  <form (ngSubmit)="submit()">
    <div class="form-grid">
      <label>
        Date
        <input type="date" name="logDate" [(ngModel)]="date" required />
      </label>
      <label>
        Hours
        <input type="number" name="logHours" [(ngModel)]="hours" min="0.1" step="0.1" placeholder="1.5" required />
      </label>
    </div>
    <label>
      What did you study?
      <textarea name="logNote" [(ngModel)]="note" placeholder="Example: SQL joins and query optimization"></textarea>
    </label>
    <button class="btn btn-primary" type="submit">Add progress</button>
  </form>
</section>
