<section>
  <h2>Log progress</h2>

  @if (isComplete() && !showFormAnyway()) {
    <div class="completed-banner">
      <fa-icon class="banner-icon" [icon]="faComplete"></fa-icon>
      <div class="completed-banner-text">
        <strong>Goal achieved</strong>
        @if (completedOn()) {
          <span>Achieved on {{ completedOn() | date: 'MMM d, y' }}</span>
        }
      </div>
    </div>
    @if (isBestType()) {
      <button class="btn btn-secondary" type="button" (click)="showFormAnyway.set(true)">Log a new best</button>
    } @else {
      <button class="text-btn" type="button" (click)="showFormAnyway.set(true)">Log more anyway</button>
    }
  } @else {
    <form (ngSubmit)="submit()">
      <div class="form-grid">
        <div class="field">
          <label for="logDate">Date</label>
          <div class="date-input-wrap">
            <input
              id="logDate"
              class="date-input"
              type="text"
              name="logDate"
              [matDatepicker]="logDatePicker"
              [(ngModel)]="date"
              readonly
              required
              (click)="logDatePicker.open()"
            />
            <mat-datepicker-toggle class="date-toggle" [for]="logDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #logDatePicker></mat-datepicker>
          </div>
        </div>
        <!-- Pass/fail goals record the result of the attempt, not a quantity. -->
        @if (isOutcome()) {
          <fieldset class="segment-field">
            <legend class="label-text">Result</legend>
            <div class="segmented">
              <label class="segment">
                <input type="radio" name="logOutcome" value="fail" [(ngModel)]="outcome" />
                <span>Failed</span>
              </label>
              <label class="segment">
                <input type="radio" name="logOutcome" value="success" [(ngModel)]="outcome" />
                <span>Success</span>
              </label>
            </div>
          </fieldset>
        } @else {
          <div class="field">
            <label for="logAmount" class="unit-label">{{ goal().unit }}</label>
            <input id="logAmount" type="number" name="logAmount" [(ngModel)]="amount" min="0" [step]="amountStep" placeholder="1.5" required />
          </div>
        }
      </div>
      <button class="btn btn-primary" type="submit" [disabled]="!canSubmit">
        {{ isOutcome() ? 'Log attempt' : 'Add progress' }}
      </button>
    </form>
  }
</section>
