<div class="modal-inner">
  <div class="modal-head">
    <h2 class="modal-title">{{ isEdit ? 'Rename group' : 'New group' }}</h2>
    <button class="close-btn" type="button" aria-label="Close" (click)="close()">&times;</button>
  </div>
  <form (ngSubmit)="submit()">
    <label>
      Group name
      <input type="text" name="groupName" [(ngModel)]="name" placeholder="Find a new job" maxlength="80" required />
    </label>
    @if (!isEdit) {
      <p class="hint">A group is just a way to organize related goals — you can also assign a goal to a group (or none) when you create it.</p>
    }
    <button class="btn btn-primary" type="submit">{{ isEdit ? 'Save' : 'Create group' }}</button>
  </form>
</div>
