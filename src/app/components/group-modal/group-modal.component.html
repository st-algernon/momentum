<div class="modal-inner">
  <div class="modal-head">
    <h2 class="modal-title">Create a general goal</h2>
    <button class="close-btn" type="button" aria-label="Close" (click)="close()">&times;</button>
  </div>
  <form (ngSubmit)="submit()">
    <label>
      Group name
      <input type="text" name="groupName" [(ngModel)]="name" placeholder="Ramp-up Hard Skills" maxlength="80" required />
    </label>
    <p class="hint">Add sub-goals to it afterwards — each with its own target and unit (hours, interviews, applications…).</p>
    <button class="btn btn-primary" type="submit">Create group</button>
  </form>
</div>
