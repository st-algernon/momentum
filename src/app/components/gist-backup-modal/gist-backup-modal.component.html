<div class="modal-inner">
  <div class="modal-head">
    <h2 class="modal-title">Backup to GitHub Gist</h2>
    <button class="close-btn" type="button" aria-label="Close" (click)="close()">&times;</button>
  </div>

  <p class="hint">
    Create a <a href="https://github.com/settings/tokens/new?scopes=gist&description=SkillTrack" target="_blank" rel="noopener">personal access token</a>
    with the <strong>gist</strong> scope. It's stored only in this browser's local storage, never sent anywhere except
    directly to api.github.com.
  </p>

  <form>
    <label>
      GitHub token
      <input type="password" name="gistToken" [(ngModel)]="token" placeholder="ghp_…" autocomplete="off" />
    </label>
    <label>
      Gist ID <span class="optional-hint">(leave blank to create a new one)</span>
      <input type="text" name="gistId" [(ngModel)]="gistId" placeholder="filled in automatically after your first backup" />
    </label>
  </form>

  <div class="actions">
    <button class="btn btn-secondary" type="button" (click)="forget()">Forget saved token</button>
    <button class="btn btn-secondary" type="button" [disabled]="busy()" (click)="restoreNow()">Restore from gist</button>
    <button class="btn btn-primary" type="button" [disabled]="busy()" (click)="backupNow()">Backup now</button>
  </div>
</div>
