<div class="modal-inner">
  <div class="modal-head">
    <h2 class="modal-title">{{ isEdit ? 'Edit goal' : 'Add a goal' }}</h2>
    <button class="close-btn" type="button" aria-label="Close" (click)="close()">&times;</button>
  </div>
  <form (ngSubmit)="submit()">
    <label>
      Goal name
      <input type="text" name="goalName" [(ngModel)]="name" placeholder="Interviews, Applications, Workouts…" maxlength="80" required />
    </label>
    <div class="form-grid">
      <label>
        Target amount
        <input type="number" name="goalTarget" [(ngModel)]="targetAmount" min="1" step="1" placeholder="100" required />
      </label>
      <label>
        Unit
        <input type="text" name="goalUnit" [(ngModel)]="unit" list="unitSuggestions" placeholder="hours" maxlength="24" />
        <datalist id="unitSuggestions">
          <option value="hours"></option>
          <option value="interviews"></option>
          <option value="applications"></option>
          <option value="offers"></option>
          <option value="sessions"></option>
          <option value="pages"></option>
          <option value="projects"></option>
        </datalist>
      </label>
    </div>
    <label>
      <span class="label-text">Group <span class="optional-hint">(optional)</span></span>
      <input
        type="text"
        name="goalGroup"
        [(ngModel)]="groupName"
        [matAutocomplete]="groupAuto"
        placeholder="Pick a group or type a new one"
        maxlength="80"
      />
      <mat-autocomplete #groupAuto="matAutocomplete">
        @for (name of filteredGroupNames(); track name) {
          <mat-option [value]="name">{{ name }}</mat-option>
        }
        @if (groupName.trim() && filteredGroupNames().length === 0) {
          <mat-option [value]="groupName.trim()">Create "{{ groupName.trim() }}"</mat-option>
        }
      </mat-autocomplete>
    </label>
    <label>
      Deadline <span class="optional-hint">(optional)</span>
      <div class="date-input-wrap">
        <input
          class="date-input"
          type="text"
          name="goalDeadline"
          [matDatepicker]="deadlinePicker"
          [(ngModel)]="deadline"
          readonly
          (click)="deadlinePicker.open()"
        />
        <mat-datepicker-toggle class="date-toggle" [for]="deadlinePicker"></mat-datepicker-toggle>
        <mat-datepicker #deadlinePicker></mat-datepicker>
      </div>
    </label>
    <button class="btn btn-primary" type="submit">{{ isEdit ? 'Save changes' : 'Create goal' }}</button>
  </form>
</div>
