<div class="modal-inner">
  <div class="modal-head">
    <h2 class="modal-title">{{ isEdit ? 'Edit goal' : 'Add a goal' }}</h2>
    <button class="close-btn" type="button" aria-label="Close" matTooltip="Close" (click)="close()"><fa-icon [icon]="faClose"></fa-icon></button>
  </div>
  <form (ngSubmit)="submit()">
    <label>
      Goal name
      <input type="text" name="goalName" [(ngModel)]="name" placeholder="Interviews, Applications, Workouts…" maxlength="80" required />
    </label>
    <label>
      <span class="label-text">Description <span class="optional-hint">(optional)</span></span>
      <textarea name="goalDescription" [(ngModel)]="description" placeholder="What is this goal about?" rows="2"></textarea>
    </label>
    <div class="goal-type-toggle" role="radiogroup" aria-label="How progress is tracked">
      <button
        type="button"
        class="type-option"
        role="radio"
        [attr.aria-checked]="goalType === 'cumulative'"
        [class.active]="goalType === 'cumulative'"
        (click)="goalType = 'cumulative'"
      >
        <strong>Add up totals</strong>
        <span>Every log adds up, e.g. hours studied</span>
      </button>
      <button
        type="button"
        class="type-option"
        role="radio"
        [attr.aria-checked]="goalType === 'best'"
        [class.active]="goalType === 'best'"
        (click)="goalType = 'best'"
      >
        <strong>Best result</strong>
        <span>Only your top log counts, e.g. reps in a row</span>
      </button>
    </div>
    <div class="form-grid">
      <label>
        {{ goalType === 'best' ? 'Target to reach' : 'Target amount' }}
        <input type="number" name="goalTarget" [(ngModel)]="targetAmount" min="1" step="1" placeholder="100" required />
      </label>
      <label>
        Unit
        <input
          type="text"
          name="goalUnit"
          class="picker-input"
          [(ngModel)]="unit"
          [matAutocomplete]="unitAuto"
          #unitTrigger="matAutocompleteTrigger"
          (click)="unitTrigger.openPanel()"
          readonly
        />
        <mat-autocomplete #unitAuto="matAutocomplete">
          @for (option of unitOptions; track option) {
            <mat-option [value]="option">{{ option }}</mat-option>
          }
        </mat-autocomplete>
      </label>
    </div>
    <label>
      <span class="label-text">Group <span class="optional-hint">(optional)</span></span>
      <input
        type="text"
        name="goalGroup"
        [(ngModel)]="groupName"
        [matAutocomplete]="groupAuto"
        placeholder="Pick a group or type a new one"
        maxlength="80"
      />
      <mat-autocomplete #groupAuto="matAutocomplete">
        @for (name of filteredGroupNames(); track name) {
          <mat-option [value]="name">{{ name }}</mat-option>
        }
        @if (groupName.trim() && filteredGroupNames().length === 0) {
          <mat-option [value]="groupName.trim()">Create "{{ groupName.trim() }}"</mat-option>
        }
      </mat-autocomplete>
    </label>
    <label>
      <span class="label-text">Deadline <span class="optional-hint">(optional)</span></span>
      <div class="date-input-wrap">
        <input
          class="date-input"
          type="text"
          name="goalDeadline"
          [matDatepicker]="deadlinePicker"
          [(ngModel)]="deadline"
          readonly
          (click)="deadlinePicker.open()"
        />
        <mat-datepicker-toggle class="date-toggle" [for]="deadlinePicker"></mat-datepicker-toggle>
        <mat-datepicker #deadlinePicker></mat-datepicker>
      </div>
    </label>
    <button class="btn btn-primary" type="submit" [disabled]="!canSubmit">{{ isEdit ? 'Save changes' : 'Create goal' }}</button>
  </form>
</div>
