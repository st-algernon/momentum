<header class="topnav">
  <div class="topnav-inner">
    <a class="brand" routerLink="/">
      <div class="brand-mark">M</div>
      <span class="brand-name">Momentum</span>
    </a>

    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a routerLink="/reports" routerLinkActive="active">Reports</a>
      <a routerLink="/settings" routerLinkActive="active">Settings</a>
    </nav>

    <button
      type="button"
      class="sync-indicator"
      [class]="'sync-' + autoSync.indicator()"
      [disabled]="autoSync.status() === 'syncing'"
      (click)="triggerSync()"
      [attr.aria-label]="syncLabel()"
      [matTooltip]="syncLabel()"
      matTooltipPosition="below"
    >
      <fa-icon class="sync-icon" [icon]="faSync" aria-hidden="true"></fa-icon>
    </button>
  </div>
</header>

<main class="page-container">
  <router-outlet></router-outlet>
</main>

<app-toast></app-toast>
