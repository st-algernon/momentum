<nav class="side-nav" aria-label="Primary">
  <div class="side-nav-links">
    <a
      class="side-nav-link"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Dashboard"
      matTooltip="Dashboard"
      matTooltipPosition="right"
    >
      <fa-icon class="side-nav-icon" [icon]="faDashboard"></fa-icon>
    </a>
    <a class="side-nav-link" routerLink="/achievements" routerLinkActive="active" aria-label="Achievements" matTooltip="Achievements" matTooltipPosition="right">
      <fa-icon class="side-nav-icon" [icon]="faAchievements"></fa-icon>
    </a>
    <a class="side-nav-link" routerLink="/reports" routerLinkActive="active" aria-label="Reports" matTooltip="Reports" matTooltipPosition="right">
      <fa-icon class="side-nav-icon" [icon]="faReports"></fa-icon>
    </a>
    <a class="side-nav-link" routerLink="/settings" routerLinkActive="active" aria-label="Settings" matTooltip="Settings" matTooltipPosition="right">
      <fa-icon class="side-nav-icon" [icon]="faSettings"></fa-icon>
    </a>
  </div>

  <button
    type="button"
    class="sync-indicator side-nav-sync"
    [class]="'sync-' + autoSync.indicator()"
    [disabled]="autoSync.status() === 'syncing'"
    (click)="triggerSync()"
    [attr.aria-label]="syncLabel()"
    [matTooltip]="syncLabel()"
    matTooltipPosition="right"
  >
    <fa-icon class="sync-icon" [icon]="faSync" aria-hidden="true"></fa-icon>
  </button>
</nav>

<main class="page-container">
  <router-outlet></router-outlet>
</main>

<nav class="bottom-nav" aria-label="Primary">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <fa-icon class="bottom-nav-icon" [icon]="faDashboard"></fa-icon>
    <span>Dashboard</span>
  </a>
  <a routerLink="/achievements" routerLinkActive="active">
    <fa-icon class="bottom-nav-icon" [icon]="faAchievements"></fa-icon>
    <span>Achievements</span>
  </a>
  <a routerLink="/reports" routerLinkActive="active">
    <fa-icon class="bottom-nav-icon" [icon]="faReports"></fa-icon>
    <span>Reports</span>
  </a>
  <a routerLink="/settings" routerLinkActive="active">
    <fa-icon class="bottom-nav-icon" [icon]="faSettings"></fa-icon>
    <span>Settings</span>
  </a>
</nav>

<app-toast></app-toast>
