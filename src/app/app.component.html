<!-- Desktop only — no logo. Sync docks right via absolute positioning so the links
     stay truly centered. -->
<nav class="top-nav" aria-label="Primary">
  <div class="top-nav-inner">
    <div class="top-nav-links">
      <a class="top-nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a class="top-nav-link" routerLink="/achievements" routerLinkActive="active">Achievements</a>
      <a class="top-nav-link" routerLink="/reports" routerLinkActive="active">Reports</a>
      <a class="top-nav-link" routerLink="/settings" routerLinkActive="active">Settings</a>
    </div>

    <button
      type="button"
      class="sync-indicator top-nav-sync"
      [class]="'sync-' + autoSync.indicator()"
      [disabled]="autoSync.status() === 'syncing'"
      (click)="triggerSync()"
      [attr.aria-label]="syncLabel()"
      [matTooltip]="syncLabel()"
      matTooltipPosition="below"
    >
      <fa-icon class="sync-icon" [icon]="faSync" aria-hidden="true"></fa-icon>
    </button>
  </div>
</nav>

<main class="page-container">
  <router-outlet></router-outlet>
</main>

<nav class="bottom-nav" aria-label="Primary">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <fa-icon class="bottom-nav-icon" [icon]="faDashboard"></fa-icon>
    <span>Dashboard</span>
  </a>
  <a routerLink="/achievements" routerLinkActive="active">
    <fa-icon class="bottom-nav-icon" [icon]="faAchievements"></fa-icon>
    <span>Achievements</span>
  </a>
  <a routerLink="/reports" routerLinkActive="active">
    <fa-icon class="bottom-nav-icon" [icon]="faReports"></fa-icon>
    <span>Reports</span>
  </a>
  <a routerLink="/settings" routerLinkActive="active">
    <fa-icon class="bottom-nav-icon" [icon]="faSettings"></fa-icon>
    <span>Settings</span>
  </a>
</nav>

<app-toast></app-toast>
