<header class="topnav">
  <div class="topnav-inner">
    <a class="brand" routerLink="/">
      <div class="brand-mark">M</div>
      <span class="brand-name">Momentum</span>
    </a>

    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a routerLink="/stats" routerLinkActive="active">Statistics</a>
      <a routerLink="/settings" routerLinkActive="active">Settings</a>
    </nav>

    <a class="sync-indicator" routerLink="/settings" [class.error]="autoSync.status() === 'error'">
      @switch (autoSync.status()) {
        @case ('syncing') { Syncing… }
        @case ('error') { Sync failed }
        @default {
          @if (autoSync.enabled()) {
            Synced
          } @else {
            Sync off
          }
        }
      }
    </a>
  </div>
</header>

<main class="page-container">
  <router-outlet></router-outlet>
</main>

<app-toast></app-toast>
